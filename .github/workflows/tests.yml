name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv venv
      - run: uv pip install -r requirements.txt pytest==8.3.5 pytest-django==4.11.1
      - run: uv run --no-project python -m pytest -q
      - run: uv run --no-project python manage.py check --settings=isitketo.test_settings
